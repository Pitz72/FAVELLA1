name: Favella Studio — build e pubblicazione (Windows / Linux)

# AVVIO SOLO MANUALE: nessun trigger automatico (niente push/PR/tag).
# GitHub → Actions → «Favella Studio — build e pubblicazione» → Run workflow.
#
#   «Pubblicare la Release?» vuota  → solo gli installer, come artefatti scaricabili
#                                      dalla pagina dell'esecuzione (build di prova);
#   spuntata                        → in più crea la Release «studio-v<versione>»
#                                      (versione = studio/package.json) con gli installer
#                                      allegati. NON è mai marcata «Latest»: quella resta
#                                      alla Release del linguaggio FAVELLA 1.
#
# macOS: volutamente NON costruito qui. Gli installer macOS non firmati e non
# notarizzati danno più grane che aiuto (Gatekeeper), e chi usa un Mac può costruirsi
# il proprio in cinque minuti: vedi studio/BUILD-MACOS.md e studio/scripts/build-locale.sh.
# La configurazione di electron-builder per macOS (studio/package.json → build.mac) è
# già pronta e testata a mano.
#
# Gli installer sono NON FIRMATI (SmartScreen su Windows avviserà al primo avvio).

on:
  workflow_dispatch:
    inputs:
      pubblica:
        description: "Pubblicare la Release su GitHub? (vuota = solo build di prova)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.etichetta }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            etichetta: Windows
            artefatti: studio/release/*.exe
          - os: ubuntu-latest
            etichetta: Linux
            artefatti: studio/release/*.AppImage

    steps:
      # Un solo checkout: motore in radice + IDE in studio/, già nel layout giusto.
      - uses: actions/checkout@v4

      # --- Il motore Python, congelato con PyInstaller ----------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa lark + pyinstaller
        run: python -m pip install --upgrade pip lark pyinstaller

      - name: Suite del motore (blocca le regressioni)
        run: |
          python test_linguaggio.py
          python test_collaudo.py

      - name: Congela il motore (favella_engine.spec)
        run: python -m PyInstaller --noconfirm favella_engine.spec

      - name: Prova il motore congelato (compila, gioca, esporta)
        run: python studio/scripts/smoke-sidecar.py

      # --- L'installer Electron -------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa le dipendenze dell'IDE
        working-directory: studio
        run: npm ci

      - name: Controllo dei tipi
        working-directory: studio
        run: npm run typecheck

      - name: Costruisci l'installer (electron-builder)
        working-directory: studio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # niente firma in CI
        run: npm run dist

      - name: Carica gli installer
        uses: actions/upload-artifact@v4
        with:
          name: favella-studio-${{ matrix.etichetta }}
          if-no-files-found: error
          path: ${{ matrix.artefatti }}

  pubblica:
    name: Pubblica la Release
    needs: build
    if: ${{ inputs.pubblica }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installer

      - name: Ricava versione e note
        id: ver
        run: |
          VER=$(node -p "require('./studio/package.json').version")
          echo "versione=$VER" >> "$GITHUB_OUTPUT"
          # Le note: la sezione di questa versione in studio/CHANGELOG.md + come si usa.
          python3 - "$VER" > note.md <<'PYEOF'
          import re, sys
          ver = sys.argv[1]
          testo = open("studio/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"## \[" + re.escape(ver) + r"\][^\n]*\n(.*?)\n---", testo, re.S)
          print("**Favella Studio** — l'ambiente di scrittura visuale per il linguaggio FAVELLA 1.\n")
          print("| Sistema | File |\n|---|---|")
          print("| Windows | `FavellaStudio-Setup-" + ver + ".exe` |")
          print("| Linux | `FavellaStudio-" + ver + ".AppImage` (`chmod +x` e doppio clic) |")
          print("| macOS | si costruisce da sé: vedi `studio/BUILD-MACOS.md` |\n")
          print("Gli installer non sono firmati: Windows può mostrare un avviso SmartScreen («Maggiori informazioni» → «Esegui comunque»).\n")
          if m:
              print("## Novità\n" + m.group(1).strip())
          PYEOF

      - name: Crea la Release (mai «Latest»)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.versione }}"
          gh release create "studio-v$VER" \
            --title "Favella Studio $VER" \
            --notes-file note.md \
            --latest=false \
            installer/*/*
