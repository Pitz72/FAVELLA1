name: Build IDE — Favella Studio (Windows / macOS / Linux)

# AVVIO SOLO MANUALE: nessun trigger automatico (niente push/PR/tag).
# Si lancia da GitHub → Actions → "Build IDE — Favella Studio" → Run workflow.
#
# NB: Favella Studio è un ESPERIMENTO in fase primordiale (vedi studio/README.md).
# Questo workflow produce installer NON FIRMATI, scaricabili come artefatti: non
# crea Release e non pubblica niente.
#
# STORIA: viveva in .github/workflows/ del repo privato Ecosystem-Runtime/
# favella-studio e faceva DUE checkout (il motore pubblico in root, l'IDE in
# studio/). Dal 2026-08-10 motore e IDE stanno nello stesso repo, quindi basta un
# checkout solo. Il file originale resta in studio/.github/ come cronaca: lì
# GitHub non lo esegue, perché registra solo i workflow in .github/workflows/
# alla RADICE del repository.

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ";"      # separatore --add-data di PyInstaller su Windows
          - os: macos-latest
            sep: ":"
          - os: ubuntu-latest
            sep: ":"

    steps:
      # Un solo checkout: motore in radice + IDE in studio/, già nel layout giusto.
      - uses: actions/checkout@v4

      # --- Sidecar Python congelato con PyInstaller ---------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa lark + pyinstaller
        run: python -m pip install --upgrade pip lark pyinstaller

      - name: Suite del motore (blocca le regressioni)
        run: |
          python test_linguaggio.py
          python test_collaudo.py

      - name: Congela il sidecar (PyInstaller, dalla radice)
        shell: bash
        run: |
          python -m PyInstaller --onefile --name favella_engine --collect-all lark \
            --add-data "favella_utils.py${{ matrix.sep }}." \
            --add-data "strutture.py${{ matrix.sep }}." \
            --add-data "libreria_azioni.py${{ matrix.sep }}." \
            --add-data "compilatore.py${{ matrix.sep }}." \
            --add-data "gioco.py${{ matrix.sep }}." \
            favella_server.py
          ls -la dist

      - name: Permessi di esecuzione al sidecar (macOS/Linux)
        if: runner.os != 'Windows'
        run: chmod +x "dist/favella_engine"

      # --- Installer Electron -------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa dipendenze IDE
        working-directory: studio
        run: npm ci

      - name: Build installer (electron-builder)
        working-directory: studio
        env:
          # Niente firma in CI: build non firmati (SmartScreen/Gatekeeper avviseranno).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Carica gli artefatti
        uses: actions/upload-artifact@v4
        with:
          name: favella-studio-${{ runner.os }}
          if-no-files-found: warn
          path: |
            studio/release/*.exe
            studio/release/*.dmg
            studio/release/*.zip
            studio/release/*.AppImage
