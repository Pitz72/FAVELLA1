<!--
  Marchio esteso di FAVELLA 1 — versione A COLORI CON LE SFUMATURE.
  È lo stato a riposo dell'animazione d'apertura (branding/marchio-animato/
  LogoFavella.tsx): foglie col gradiente verde→teal→blu, gemma oro, libro e
  graffe blu scuro, scritta chiara. Gli effetti animati (aloni, bagliore,
  scintilla) non sono inclusi. Fondo scuro incluso: rimuovi il <rect> di fondo
  e il relativo gradiente per avere il marchio su sfondo trasparente.
-->
