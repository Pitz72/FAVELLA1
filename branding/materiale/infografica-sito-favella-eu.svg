  <rect x="1016" y="748" width="58" height="58" rx="16" fill="url(#chip)"/>
  <polyline points="1033,778 1041,786 1058,766" fill="none" stroke="#050a14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1100" y="778" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="30" font-weight="700" fill="#eaf3fb">Libreria</text>
  <text x="1100" y="806" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="21" fill="#9fb3c8">Moduli .fav pronti da includere nelle storie.</text>
