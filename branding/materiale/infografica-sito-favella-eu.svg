  <polyline points="1033,864 1041,872 1058,852" fill="none" stroke="#050a14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1100" y="864" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="30" font-weight="700" fill="#eaf3fb">Collabora</text>
  <text x="1100" y="892" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="21" fill="#9fb3c8">Progetto open source: codice, storie, idee.</text>
