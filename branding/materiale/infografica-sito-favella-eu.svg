  <rect x="140" y="920" width="58" height="58" rx="16" fill="url(#chip)"/>
  <polyline points="157,950 165,958 182,938" fill="none" stroke="#050a14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="224" y="950" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="30" font-weight="700" fill="#eaf3fb">Corso interattivo</text>
  <text x="224" y="978" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="21" fill="#9fb3c8">Ventuno «cassette», con il motore FAVELLA vero.</text>
