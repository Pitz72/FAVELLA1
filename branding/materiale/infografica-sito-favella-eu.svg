  <rect x="140" y="748" width="58" height="58" rx="16" fill="url(#chip)"/>
  <polyline points="157,778 165,786 182,766" fill="none" stroke="#050a14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="224" y="778" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="30" font-weight="700" fill="#eaf3fb">Novità &amp; roadmap</text>
  <text x="224" y="806" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="21" fill="#9fb3c8">Changelog, traguardo 1.0.0 e prossimi passi.</text>
  <rect x="224" y="822" width="716" height="1" fill="#1e3a52" fill-opacity="0.5"/>
  <rect x="140" y="834" width="58" height="58" rx="16" fill="url(#chip)"/>
  <polyline points="157,864 165,872 182,852" fill="none" stroke="#050a14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
