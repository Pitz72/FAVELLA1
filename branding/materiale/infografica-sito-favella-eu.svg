<text x="960" y="516" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#eaf3fb">TUTTO QUELLO CHE TROVI NEL SITO</text>

  <rect x="140" y="576" width="58" height="58" rx="16" fill="url(#chip)"/>
  <polyline points="157,606 165,614 182,594" fill="none" stroke="#050a14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
