  <rect x="1016" y="576" width="58" height="58" rx="16" fill="url(#chip)"/>
  <polyline points="1033,606 1041,614 1058,594" fill="none" stroke="#050a14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1100" y="606" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="30" font-weight="700" fill="#eaf3fb">Programma</text>
  <text x="1100" y="634" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="21" fill="#9fb3c8">Scrivi ed esegui storie nel browser, senza installare.</text>
  <rect x="1100" y="650" width="710" height="1" fill="#1e3a52" fill-opacity="0.5"/>
