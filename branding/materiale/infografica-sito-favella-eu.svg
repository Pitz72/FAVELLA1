<text x="960" y="1046" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#5cf3ff">681 test verdi · 0 ambiguità · 100% italiano · sito pre-renderizzato · open source</text>
