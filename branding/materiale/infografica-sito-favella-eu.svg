<text x="960" y="318" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="196" font-weight="800" letter-spacing="2" text-anchor="middle" fill="url(#ver)">FAVELLA.EU</text>
<text x="960" y="392" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#9fb3c8">L'italiano è il linguaggio di programmazione</text>
